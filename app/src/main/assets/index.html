<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>وایت‌برد آموزشی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:#e8eaf0;display:flex;flex-direction:column;height:100vh}
#bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#1f2937;color:#fff;align-items:center}
button,select{font-family:inherit;padding:6px 10px;border:0;border-radius:6px;background:#374151;color:#fff;cursor:pointer}
button.on{background:#2563eb}
button.rec{background:#dc2626}
input[type=color]{width:36px;height:30px;border:0;padding:0}
#wrap{flex:1;overflow:auto;display:flex;justify-content:center;padding:10px}
#board{background:#fff;width:100%;max-width:1400px;aspect-ratio:16/9;box-shadow:0 2px 12px #0003;touch-action:none;cursor:crosshair}
#media{position:fixed;left:12px;bottom:12px;width:320px;display:none;background:#000;border-radius:8px;z-index:5}
#media video,#media audio{width:100%}
#media b{position:absolute;top:2px;right:6px;color:#fff;cursor:pointer;z-index:6}
#tbox{display:none;position:fixed;inset:0;background:#0006;z-index:9;align-items:center;justify-content:center}
#tbox div{background:#fff;padding:12px;border-radius:8px;width:min(90vw,420px)}
#tbox textarea{width:100%;font-family:inherit;font-size:16px}
#tbox button{margin-top:8px}
</style>
</head>
<body>
<div id="bar">
 <button data-t="pen" class="on">✏️ قلم</button>
 <button data-t="eraser">🧽 پاک‌کن</button>
 <button data-t="line">╱ خط</button>
 <button data-t="rect">▭ مستطیل</button>
 <button data-t="circle">◯ دایره</button>
 <button data-t="text">T متن</button>
 <input type="color" id="color" value="#111111">
 <select id="size"><option>2</option><option selected>4</option><option>8</option><option>16</option></select>
 <button id="undo">↩️ بازگشت</button>
 <button id="clear">🗑 پاک‌کردن صفحه</button>
 <button id="prev">▶</button><span id="pg">1/1</span><button id="next">◀</button>
 <button id="add">➕ صفحه</button>
 <button id="up">📁 آپلود فایل</button>
 <button id="png">💾 ذخیره تصویر</button>
 <button id="recBtn">⏺ ضبط تخته + صدا</button>
 <input type="file" id="file" hidden accept="image/*,application/pdf,video/*,audio/*,text/*,.txt" multiple>
</div>
<div id="wrap"><canvas id="board" width="1600" height="900"></canvas></div>
<div id="media"><b id="mx">✕</b><div id="mbox"></div></div>
<div id="tbox"><div>
 <textarea id="tin" rows="4" dir="auto" placeholder="متن را بنویسید..."></textarea>
 <button id="tok">✔ درج</button> <button id="tno">✖ لغو</button>
</div></div>
<script>
const cv=document.getElementById('board'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const FONT='Vazirmatn,Tahoma,sans-serif';
let tool='pen',drawing=false,sx,sy,base,pages=[null],cur=0,hist=[],tx=0,ty=0;
function blank(){ctx.globalCompositeOperation='source-over';ctx.fillStyle='#fff';ctx.fillRect(0,0,1600,900)}
blank();
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*1600/r.width,(e.clientY-r.top)*900/r.height]}
function snap(){hist.push(cv.toDataURL());if(hist.length>30)hist.shift()}
function style(){ctx.strokeStyle=tool=='eraser'?'#fff':$('color').value;ctx.fillStyle=$('color').value;ctx.lineWidth=tool=='eraser'?$('size').value*4:+$('size').value;ctx.lineCap=ctx.lineJoin='round'}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x==b))});

// ---- متن ----
cv.onpointerdown=e=>{
 const[x,y]=pos(e);
 if(tool=='text'){tx=x;ty=y;$('tin').value='';$('tbox').style.display='flex';setTimeout(()=>$('tin').focus(),50);return}
 snap();drawing=true;sx=x;sy=y;style();cv.setPointerCapture(e.pointerId);
 base=ctx.getImageData(0,0,1600,900);
 if(tool=='pen'||tool=='eraser'){ctx.beginPath();ctx.moveTo(x,y)}
};
$('tno').onclick=()=>$('tbox').style.display='none';
$('tok').onclick=()=>{
 const t=$('tin').value;$('tbox').style.display='none';if(!t.trim())return;
 snap();const fs=+$('size').value*6+12;
 ctx.font=fs+'px '+FONT;ctx.fillStyle=$('color').value;
 const rtl=/[\u0600-\u06FF]/.test(t);ctx.direction=rtl?'rtl':'ltr';ctx.textAlign=rtl?'right':'left';
 t.split('\n').forEach((l,i)=>ctx.fillText(l,tx,ty+i*fs*1.3));
};
cv.onpointermove=e=>{
 if(!drawing)return;const[x,y]=pos(e);
 if(tool=='pen'||tool=='eraser'){ctx.lineTo(x,y);ctx.stroke();return}
 ctx.putImageData(base,0,0);ctx.beginPath();
 if(tool=='line'){ctx.moveTo(sx,sy);ctx.lineTo(x,y)}
 if(tool=='rect')ctx.rect(sx,sy,x-sx,y-sy);
 if(tool=='circle')ctx.ellipse((sx+x)/2,(sy+y)/2,Math.abs(x-sx)/2,Math.abs(y-sy)/2,0,0,7);
 ctx.stroke();
};
cv.onpointerup=cv.onpointercancel=()=>drawing=false;

// ---- صفحه‌ها ----
function load(url,cb){const i=new Image();i.onload=()=>{blank();ctx.drawImage(i,0,0);cb&&cb()};i.src=url}
$('undo').onclick=()=>{if(hist.length)load(hist.pop())};
$('clear').onclick=()=>{snap();blank()};
function save(){pages[cur]=cv.toDataURL()}
function show(i){save();cur=i;hist=[];pages[i]?load(pages[i]):blank();$('pg').textContent=(cur+1)+'/'+pages.length}
$('add').onclick=()=>{save();pages.splice(cur+1,0,null);show(cur+1)};
$('prev').onclick=()=>cur>0&&show(cur-1);
$('next').onclick=()=>cur<pages.length-1&&show(cur+1);
function insertPages(list){save();list.forEach((d,i)=>pages.splice(cur+1+i,0,d));show(cur+1)}

// ---- ذخیره فایل (اندروید و مرورگر) ----
function toB64(blob){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)})}
async function saveBlob(blob,name){
 if(window.Android&&Android.saveFile){Android.saveFile(name,blob.type||'application/octet-stream',await toB64(blob))}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
}
$('png').onclick=()=>cv.toBlob(b=>saveBlob(b,'board-'+Date.now()+'.png'));

// ---- آپلود ----
$('up').onclick=()=>$('file').click();
function off(){const c=document.createElement('canvas');c.width=1600;c.height=900;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,1600,900);return[c,g]}
function fit(g,src,w,h){const s=Math.min(1600/w,900/h);const dw=w*s,dh=h*s;g.drawImage(src,(1600-dw)/2,(900-dh)/2,dw,dh)}
function media(el){$('mbox').innerHTML='';$('mbox').appendChild(el);$('media').style.display='block'}
$('mx').onclick=()=>{$('mbox').innerHTML='';$('media').style.display='none'};
async function readText(f){
 const buf=await f.arrayBuffer();
 try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}
 catch(_){try{return new TextDecoder('windows-1256').decode(buf)}catch(__){return new TextDecoder().decode(buf)}}
}
function wrap(g,text,maxW){
 const out=[];
 text.replace(/\r/g,'').split('\n').forEach(p=>{
  if(!p.trim()){out.push('');return}
  let line='';
  p.split(/\s+/).forEach(w=>{const t=line?line+' '+w:w;if(g.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});
  out.push(line);
 });
 return out;
}
async function textPages(text){
 const rtl=/[\u0600-\u06FF]/.test(text);
 const[,g0]=off();g0.font='34px '+FONT;
 const lines=wrap(g0,text,1480),per=16,list=[];
 for(let i=0;i<lines.length;i+=per){
  const[c,g]=off();
  g.font='34px '+FONT;g.fillStyle=$('color').value;
  g.direction=rtl?'rtl':'ltr';g.textAlign=rtl?'right':'left';
  lines.slice(i,i+per).forEach((l,k)=>g.fillText(l,rtl?1560:40,70+k*50));
  list.push(c.toDataURL());
 }
 if(list.length)insertPages(list);
}
$('file').onchange=async e=>{
 for(const f of e.target.files){
  try{
   const name=f.name.toLowerCase();
   if(f.type.startsWith('image/')){
    const url=URL.createObjectURL(f);const i=new Image();
    i.onload=()=>{snap();fit(ctx,i,i.width,i.height)};i.src=url;
   }else if(f.type.startsWith('video/')||f.type.startsWith('audio/')){
    const m=document.createElement(f.type.startsWith('video')?'video':'audio');
    m.src=URL.createObjectURL(f);m.controls=true;media(m);
   }else if(f.type=='application/pdf'||name.endsWith('.pdf')){
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;const list=[];
    for(let n=1;n<=pdf.numPages;n++){
     const p=await pdf.getPage(n),vp=p.getViewport({scale:2}),c=document.createElement('canvas');
     c.width=vp.width;c.height=vp.height;
     await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
     const[oc,g]=off();fit(g,c,c.width,c.height);
